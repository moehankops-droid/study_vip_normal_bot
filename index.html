<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master - Duolingo Style Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif; 
            background: #f7f7f7; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: white; 
            padding: 30px 25px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 2px solid #e5e5e5;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            font-weight: 800; 
            font-size: 16px; 
            border-bottom: 2px solid #f0f2f5; 
            padding-bottom: 12px; 
        }
        .streak { color: #ff9600; display: flex; align-items: center; gap: 5px; }
        .score { color: #58cc02; display: flex; align-items: center; gap: 5px; }
        
        h2 { color: #3c3c3c; margin-top: 0; font-size: 24px; font-weight: 900; }
        
        .start-btn { 
            background: #58cc02; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            border-radius: 16px; 
            font-size: 18px; 
            cursor: pointer; 
            margin-top: 20px; 
            width: 100%; 
            font-weight: 800; 
            box-shadow: 0 5px 0 #46a302; 
            transition: 0.1s; 
            text-transform: uppercase;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #46a302; }
        .start-btn:hover { background: #61e002; }

        .question-box { 
            font-size: 20px; 
            margin: 20px 0 25px 0; 
            font-weight: 800; 
            color: #3c3c3c; 
            text-align: left; 
            line-height: 1.4;
        }
        
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 15px; 
        }
        
        .options button { 
            background: #ffffff; 
            color: #4b4b4b; 
            border: 2px solid #e5e5e5; 
            border-bottom: 4px solid #e5e5e5; 
            border-radius: 16px; 
            width: 100%; 
            text-align: left; 
            padding: 15px 18px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.1s ease;
        }
        .options button:hover { 
            background: #f7f7f7; 
            border-color: #84d8ff; 
            color: #1cb0f6; 
        }
        .options button:active { 
            transform: translateY(2px); 
            border-bottom-width: 2px; 
        }

        .explanation { 
            margin-top: 20px; 
            padding: 15px; 
            background: #d7ffb8; 
            border: 2px solid #58cc02; 
            text-align: left; 
            font-size: 14px; 
            color: #276709; 
            display: none; 
            border-radius: 14px; 
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="streak">🔥 <span id="streak-count">0</span></span>
        <span class="score">⭐ <span id="score-count">0</span></span>
    </div>
    <h2>English Quiz</h2>
    <div id="quiz-container">
        <p style="color: #777; font-size: 16px; font-weight: 600;">Duolingo စတိုင် အလန်းစား ဒီဇိုင်းအသစ်ဖြင့် အင်္ဂလိပ်စာ လေ့လာကြပါစို့။</p>
        <button class="start-btn" onclick="startQuiz()">စတင်မည်</button>
    </div>
</div>

<script src="questions.js"></script>

<script>
let score = 0;
let streak = 0;
let currentQuiz = null;

function startQuiz() {
    score = 0;
    streak = 0;
    updateHeader();
    loadNextQuestion();
}

function updateHeader() {
    document.getElementById("score-count").innerText = score;
    document.getElementById("streak-count").innerText = streak;
}

function loadNextQuestion() {
    if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
        document.getElementById("quiz-container").innerHTML = "<p style='color:red; font-weight:bold;'>မေးခွန်းများ ရှာမတွေ့ပါ။</p>";
        return;
    }

    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * questionsBank.length);
    currentQuiz = questionsBank[randomIndex];

    let optionsHTML = "";
    currentQuiz.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${currentQuiz.answer.replace(/'/g, "\\'")}', '${currentQuiz.explanation.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="question-box">${currentQuiz.question}</div>
        <div class="options">${optionsHTML}</div>
        <div id="explanation-box" class="explanation"></div>
    `;
}

function checkAnswer(button, selected, correct, explanation) {
    const buttons = document.querySelectorAll('.options button');
    buttons.forEach(btn => btn.disabled = true);

    const expBox = document.getElementById("explanation-box");
    expBox.style.display = "block";
    expBox.innerHTML = `<strong>ရှင်းလင်းချက်:</strong> ${explanation}`;

    if (selected.trim() === correct.trim()) {
        button.style.background = "#d7ffb8";
        button.style.color = "#276709";
        button.style.borderColor = "#58cc02";
        button.style.borderBottomColor = "#46a302";
        
        expBox.style.background = "#d7ffb8";
        expBox.style.color = "#276709";
        expBox.style.borderColor = "#58cc02";
        
        score += 10;
        streak += 1;
    } else {
        button.style.background = "#ffdfe0";
        button.style.color = "#ea2b2b";
        button.style.borderColor = "#ff4b4b";
        button.style.borderBottomColor = "#ea2b2b";
        
        expBox.style.background = "#ffdfe0";
        expBox.style.color = "#ea2b2b";
        expBox.style.borderColor = "#ff4b4b";
        
        streak = 0;
    }

    updateHeader();

    setTimeout(() => {
        loadNextQuestion();
    }, 3500);
}
</script>

</body>
</html>
