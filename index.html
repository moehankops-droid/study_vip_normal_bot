<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study VIP English RPG</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #111827;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }
        .header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .header h2 { margin: 0; font-size: 18px; color: #fff; }
        .header p { margin: 5px 0 0; font-size: 11px; color: #e2e8f0; }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 13px;
        }
        .card {
            background: #1e293b;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #38bdf8;
        }
        .card h3 { margin: 0 0 6px 0; font-size: 15px; color: #38bdf8; }
        .card p { margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.5; }
        
        .example-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 11px;
            color: #34d399;
            border: 1px dashed #334155;
            line-height: 1.6;
        }
        
        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
            text-align: left;
        }
        .btn:hover { opacity: 0.9; }
        
        .map-btn {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .map-btn:hover { background: #334155; border-color: #38bdf8; }

        .option-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 6px;
            text-align: left;
        }
        .option-btn:hover { background: #475569; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🗺️ Study VIP English RPG</h2>
        <p>Open World Clean Dashboard</p>
    </div>

    <div class="stats">
        <div>⭐ Level: <span id="lvl">1</span></div>
        <div>⚡ XP: <span id="xp">0</span></div>
        <div>❤️ HP: <span id="hp">100</span></div>
    </div>

    <!-- 1. MAP SELECTION SCREEN (Home) -->
    <div id="map-screen">
        <div class="card" style="border-left-color: #10b981; margin-bottom: 15px;">
            <h3>📍 လေ့လာလိုသော နယ်မြေကို ရွေးပါ</h3>
            <p>အောက်ပါ နယ်မြေများထဲမှ တစ်ခုချင်းစီကို သီးသန့် ဝင်ရောက်လေ့လာနိုင်ပါသည်။</p>
        </div>

        <button class="map-btn" onclick="openSection('smart')">
            <span>🎯 1. SMART Goals နယ်မြေ</span> ➔
        </button>
        <button class="map-btn" onclick="openSection('present')">
            <span>⚔️ 2. Present Tenses (၄) မျိုး</span> ➔
        </button>
        <button class="map-btn" onclick="openSection('past')">
            <span>🛡️ 3. Past Tenses (၄) မျိုး</span> ➔
        </button>
        <button class="map-btn" onclick="openSection('future')">
            <span>🚀 4. Future Tenses (၄) မျိုး</span> ➔
        </button>
        <button class="map-btn" onclick="openSection('confusing')">
            <span>💎 5. Confusing Words</span> ➔
        </button>
        <button class="map-btn" style="border-color: #ef4444; background: #1f1725;" onclick="openQuiz()">
            <span>⚡ စိန်ခေါ်မှု (Quiz) ဖြေမည်</span> ⚔️
        </button>
    </div>

    <!-- 2. DETAIL CONTENT SCREEN (Individual Section) -->
    <div id="detail-screen" class="hidden">
        <div id="detail-content"></div>
        <button class="btn" style="background: #ef4444; margin-top: 15px;" onclick="returnToMap()">🔙 မြေပုံသို့ ပြန်မည်</button>
    </div>

    <!-- 3. QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="card" style="border-left-color: #ef4444;">
            <h3>⚡ Quest Quiz Challenge</h3>
            <p id="q-text" style="color: #fff; font-size: 13px; margin-top: 8px;"></p>
        </div>
        <div id="options-container"></div>
        <button class="btn" style="background: #ef4444; margin-top: 15px;" onclick="returnToMap()">🔙 မြေပုံသို့ ပြန်မည်</button>
    </div>
</div>

<script>
    let player = { level: 1, xp: 0, hp: 100 };

    const sections = {
        smart: {
            title: "🎯 1. SMART Goals ရည်မှန်းချက်များ",
            desc: "Specific, Measurable, Attainable, Realistic, Timely ဖြင့် စနစ်တကျ ဖော်ထုတ်ပါ။",
            ex: "✔️ I gonna eat breakfast at 8Am. (မနက် ၈ နာရီမှာ မနက်စာစားမယ်။)<br>✔️ I will shower at 12Pm. (၁၂ နာရီမှာ ရေချိုးမယ်။)"
        },
        present: {
            title: "⚔️ 2. Present Tenses (၄) မျိုး",
            desc: "လက်ရှိကာလ အသုံးပြုပုံများနှင့် ဥပမာများ",
            ex: "• <b>Present Simple:</b> She reads every morning. (သူမ မနက်တိုင်း စာဖတ်သည်။)<br>• <b>Present Continuous:</b> You are watching my video. (မင်း video ကြည့်နေသည်။)<br>• <b>Present Perfect:</b> She has read five books. (သူမ စာအုပ် ၅ အုပ် ဖတ်ပြီးပြီ။)<br>• <b>Present Perfect Cont.:</b> I have been reading for 2 hours."
        },
        past: {
            title: "🛡️ 3. Past Tenses (၄) မျိုး",
            desc: "လွန်ခဲ့သော အတိတ်ကာလ အသုံးပြုပုံများနှင့် ဥပမာများ",
            ex: "• <b>Past Simple:</b> I visited my grandparents yesterday. (မနေ့က အဘိုးအဘွားတွေဆီ သွားခဲ့တယ်။)<br>• <b>Past Continuous:</b> He was playing football. (သူ ဘောလုံးကစားနေသည်။)<br>• <b>Past Perfect:</b> I had read the book before.<br>• <b>Past Perfect Cont.:</b> I had been studying for hours."
        },
        future: {
            title: "🚀 4. Future Tenses (၄) မျိုး",
            desc: "နောင်လာမည့် အနာဂတ်ကာလ အသုံးပြုပုံများနှင့် ဥပမာများ",
            ex: "• <b>Future Simple:</b> I will read the book tomorrow. (မနက်ဖြန် စာအုပ်ဖတ်မယ်။)<br>• <b>Future Continuous:</b> I will be reading at 5PM.<br>• <b>Future Perfect:</b> I will have read the book.<br>• <b>Future Perfect Cont.:</b> I'll have been reading for two hours."
        },
        confusing: {
            title: "💎 5. Confusing Words",
            desc: "အမြဲမှားတတ်သော စကားစုများ",
            ex: "✔️ I need to do my homework. (အိမ်စာလုပ်သည် - do)<br>✔️ I made a cake for you. (ကိတ်မုန့်လုပ်သည် - make)"
        }
    };

    const questions = [
        {
            q: "SMART goals တွင် 'M' က ဘာကို ကိုယ်စားပြုသနည်း?",
            options: ["A) Meaningful", "B) Measurable", "C) Modern", "D) Moving"],
            answer: 1
        },
        {
            q: "What is the past tense of 'go'?",
            options: ["A) Goed", "B) Gone", "C) Went", "D) Going"],
            answer: 2
        },
        {
            q: "အိမ်စာလုပ်သည် ဟု သုံးနှုန်းရာတွင် အသုံးပြုရသည့် စကားလုံးမှာ -",
            options: ["A) Make homework", "B) Do homework", "C) Play homework", "D) Take homework"],
            answer: 1
        }
    ];

    let currentQIndex = 0;

    function updateStats() {
        document.getElementById('lvl').innerText = player.level;
        document.getElementById('xp').innerText = player.xp;
        document.getElementById('hp').innerText = player.hp;
    }

    function openSection(key) {
        document.getElementById('map-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('detail-screen').classList.remove('hidden');

        let data = sections[key];
        document.getElementById('detail-content').innerHTML = `
            <div class="card">
                <h3>${data.title}</h3>
                <p>${data.desc}</p>
                <div class="example-box">${data.ex}</div>
            </div>
        `;
    }

    function openQuiz() {
        document.getElementById('map-screen').classList.add('hidden');
        document.getElementById('detail-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        let qData = questions[currentQIndex];
        document.getElementById('q-text').innerText = qData.q;
        
        let optHtml = '';
        qData.options.forEach((opt, index) => {
            optHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optHtml;
    }

    function checkAnswer(selected) {
        let qData = questions[currentQIndex];
        if (selected === qData.answer) {
            alert("🎉 အဖြေမှန်ပါတယ်! XP +25 ရရှိသည်။");
            player.xp += 25;
            if (player.xp >= 50) {
                player.level++;
                player.xp = 0;
                alert("🌟 Level တက်သွားပါပြီ!");
            }
        } else {
            alert("❌ အဖြေမှားပါတယ်။ HP -20 လျော့သွားသည်။");
            player.hp -= 20;
            if (player.hp <= 0) {
                alert("💀 Game Over! အသက်ကုန်သွားပါပြီ။");
                player.hp = 100;
                player.xp = 0;
            }
        }
        updateStats();
        currentQIndex = (currentQIndex + 1) % questions.length;
        returnToMap();
    }

    function returnToMap() {
        document.getElementById('detail-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('map-screen').classList.remove('hidden');
    }

    updateStats();
</script>

</body>
</html>
