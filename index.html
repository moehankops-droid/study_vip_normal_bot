<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz - Global Leaderboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid #333;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            font-weight: bold; 
            font-size: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }
        .streak { color: #ff9800; }
        .score { color: #4caf50; }
        .study-timer { 
            background: #2a2a2a; 
            color: #00e676; 
            font-weight: bold; 
            font-size: 15px; 
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        
        h2 { color: #ffffff; margin-top: 0; font-size: 22px; }
        
        .start-btn, .action-btn, .finish-btn { 
            background: #4caf50; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        .start-btn:hover, .action-btn:hover { background: #43a047; }
        .finish-btn { background: #ff5252; margin-top: 10px; }
        .finish-btn:hover { background: #e53935; }

        .question-box { 
            font-size: 18px; 
            margin: 15px 0 20px 0; 
            font-weight: bold; 
            color: #ffffff; 
            text-align: left; 
            line-height: 1.5;
        }
        
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 15px; 
        }
        
        .options button { 
            background: #2a2a2a; 
            color: #e0e0e0; 
            border: 1px solid #444; 
            border-radius: 12px; 
            width: 100%; 
            text-align: left; 
            padding: 14px 16px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease;
        }
        .options button:hover { 
            background: #333333; 
            border-color: #4caf50; 
            color: #ffffff; 
        }

        .explanation { 
            margin-top: 15px; 
            padding: 12px; 
            background: #1b2e1b; 
            border: 1px solid #2e7d32; 
            text-align: left; 
            font-size: 13px; 
            color: #a5d6a7; 
            display: none; 
            border-radius: 10px; 
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .leaderboard-list {
            text-align: left;
            background: #252525;
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #333;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .leaderboard-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-view">
        <h2>English Grammar Quiz</h2>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">မိနစ် ၂၀ စာကျက်ချိန် • Streak များလေ မှတ်ပိုရလေ စနစ်</p>
        
        <div style="text-align: left; margin-bottom: 5px; font-size: 13px; color: #ff9800;">သင့်နာမည် (Username) ထည့်ပါ:</div>
        <input type="text" id="username-input" placeholder="ဥပမာ - Moe Han" maxlength="15">
        <button class="start-btn" onclick="prepareAndStartQuiz()">စတင်မည် (Start)</button>
        
        <div id="leaderboard-section" class="leaderboard-list" style="margin-top: 20px;">
            <strong style="color: #ff9800; font-size: 14px;">🏆 ကမ္ဘာ့ထိပ်ဆုံး ရမှတ်များ (Global Leaderboard)</strong>
            <div id="high-scores" style="margin-top: 8px;">
                <p style="color: #777; font-size: 13px; text-align: center;">ဒေတာများ ရယူနေပါသည်...</p>
            </div>
        </div>
    </div>

    <div id="quiz-view" style="display: none;">
        <div class="header">
            <span class="streak">🔥 Streak: <span id="streak-count">0</span></span>
            <span class="score">⭐ Score: <span id="score-count">0</span></span>
        </div>
        <div id="quiz-container"></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClv4XqqbYFcRowwpV8StLFWwbjaOx-5gQ",
    authDomain: "study-bot-61a39.firebaseapp.com",
    databaseURL: "https://study-bot-61a39-default-rtdb.firebaseio.com",
    projectId: "study-bot-61a39",
    storageBucket: "study-bot-61a39.firebasestorage.app",
    messagingSenderId: "637683324139",
    appId: "1:637683324139:web:3c2f4e38ac89e773f69aae"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Username တစ်ခုတည်းနဲ့ High Score ကို စစ်ဆေးပြီး သိမ်းမယ့်စနစ်
  window.saveScoreToFirebase = function(name, finalScore) {
      const cleanName = name.replace(/[.#$\/\[\]]/g, "_").trim(); // Firebase path အတွက် မသင့်တော်တဲ့ သင်္ကေတများ ဖယ်မည်
      const userScoreRef = ref(db, 'scores/' + cleanName);

      get(userScoreRef).then((snapshot) => {
          let existingScore = 0;
          if (snapshot.exists()) {
              existingScore = snapshot.val().score || 0;
          }

          // ယခုရမှတ်က အရင်ရမှတ်ထက် ပိုများမှသာ အသစ်တင်မည် (သို့မဟုတ် ပထမဆုံးအကြိမ်ဆိုရင် တတင်မည်)
          if (finalScore > existingScore) {
              set(userScoreRef, {
                  name: name,
                  score: finalScore,
                  timestamp: Date.now()
              }).then(() => {
                  alert(`🎉 ဂုဏ်ယူပါတယ်! သင်၏ အမှတ်အသစ် (${finalScore} မှတ်) ကို Global Leaderboard သို့ အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။`);
                  location.reload();
              }).catch((error) => {
                  alert("❌ သိမ်းဆည်းရာတွင် အမှားအယွင်းရှိပါသည်: " + error.message);
              });
          } else {
              alert(`ℹ️ သင်၏ ယခင်အမှတ်အမြင့်ဆုံး (${existingScore} မှတ်) ကသာ ပိုများနေပါသဖြင့် အသစ်မသိမ်းပါ။`);
              location.reload();
          }
      }).catch((error) => {
          console.error(error);
      });
  };

  window.loadLeaderboardFromFirebase = function() {
      const scoresRef = ref(db, 'scores');
      const topScoresQuery = query(scoresRef, orderByChild('score'), limitToLast(5));
      
      onValue(topScoresQuery, (snapshot) => {
          const lbContainer = document.getElementById("high-scores");
          if (!snapshot.exists()) {
              lbContainer.innerHTML = `<p style="color: #777; font-size: 13px; text-align: center;">မှတ်တမ်း မရှိသေးပါ။</p>`;
              return;
          }

          let scoresList = [];
          snapshot.forEach((childSnapshot) => {
              scoresList.push(childSnapshot.val());
          });

          scoresList.sort((a, b) => b.score - a.score);

          let html = "";
          scoresList.forEach((item, index) => {
              html += `
                  <div class="leaderboard-item">
                      <span>#${index + 1} ${item.name}</span>
                      <span style="color: #4caf50; font-weight: bold;">${item.score} မှတ်</span>
                  </div>
              `;
          });
          lbContainer.innerHTML = html;
      });
  };

  window.loadLeaderboardFromFirebase();
</script>

<script src="questions.js"></script>

<script>
let playerName = "";
let score = 0;
let streak = 0;
let currentQuiz = null;
let studyTimer = null;
let totalSeconds = 20 * 60;

function prepareAndStartQuiz() {
    const nameInput = document.getElementById("username-input").value.trim();
    if (!nameInput) {
        alert("ကျေးဇူးပြု၍ သင့်နာမည် (Username) ကို အရင်ထည့်ပါ။");
        return;
    }
    playerName = nameInput;
    
    // Page ပြောင်းမည်
    document.getElementById("main-view").style.display = "none";
    document.getElementById("quiz-view").style.display = "block";
    
    startQuiz();
}

function startQuiz() {
    score = 0;
    streak = 0;
    totalSeconds = 20 * 60;
    updateHeader();
    startStudySessionTimer();
    loadNextQuestion();
}

function updateHeader() {
    document.getElementById("score-count").innerText = score;
    document.getElementById("streak-count").innerText = streak;
}

function startStudySessionTimer() {
    if(studyTimer) clearInterval(studyTimer);

    studyTimer = setInterval(() => {
        totalSeconds--;
        let mins = Math.floor(totalSeconds / 60);
        let secs = totalSeconds % 60;
        
        let timerDisplay = document.getElementById("session-timer");
        if(timerDisplay) {
            timerDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        if (totalSeconds <= 0) {
            clearInterval(studyTimer);
            endGame("⏳ မိနစ် ၂၀ ပြည့်သွားပါပြီ!");
        }
    }, 1000);
}

function loadNextQuestion() {
    if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
        document.getElementById("quiz-container").innerHTML = "<p style='color:#f44336; font-weight:bold;'>မေးခွန်းများ ရှာမတွေ့ပါ။</p>";
        return;
    }

    let mins = Math.floor(totalSeconds / 60);
    let secs = totalSeconds % 60;
    let timeFormatted = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * questionsBank.length);
    currentQuiz = questionsBank[randomIndex];

    let optionsHTML = "";
    currentQuiz.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${currentQuiz.answer.replace(/'/g, "\\'")}', '${currentQuiz.explanation.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="study-timer">
            <span>⏳ ကျန်ရှိချိန်:</span>
            <span id="session-timer" style="font-family: monospace; font-size: 16px;">${timeFormatted}</span>
        </div>
        <div class="question-box">${currentQuiz.question}</div>
        <div class="options">${optionsHTML}</div>
        <div id="explanation-box" class="explanation"></div>
        <button class="finish-btn" onclick="endGame('🛑 လေ့ကျင့်ခန်းကို ပြီးဆုံးခဲ့ပါပြီ!')">လေ့ကျင့်ခန်း ပြီးဆုံးမည် (Finish)</button>
    `;
}

function checkAnswer(button, selected, correct, explanation) {
    const buttons = document.querySelectorAll('.options button');
    buttons.forEach(btn => btn.disabled = true);

    const expBox = document.getElementById("explanation-box");
    expBox.style.display = "block";
    expBox.innerHTML = `<strong>ရှင်းလင်းချက်:</strong> ${explanation}`;

    if (selected.trim() === correct.trim()) {
        button.style.background = "#1b2e1b";
        button.style.color = "#a5d6a7";
        button.style.borderColor = "#4caf50";
        
        expBox.style.background = "#1b2e1b";
        expBox.style.color = "#a5d6a7";
        expBox.style.borderColor = "#4caf50";
        
        // Streak အလိုက် အမှတ်တိုးမည့်စနစ် (မှန်ရင် streak တက်မယ်၊ ဥပမာ streak 2 ဆိုရင် 2 မှတ်၊ 3 ဆိုရင် 3 မှတ် တိုးမယ်)
        streak += 1;
        score += streak; 
    } else {
        button.style.background = "#3c1f1f";
        button.style.color = "#ef9a9a";
        button.style.borderColor = "#f44336";
        
        expBox.style.background = "#3c1f1f";
        expBox.style.color = "#ef9a9a";
        expBox.style.borderColor = "#f44336";
        
        streak = 0; // မှားရင် Streak ပြန်ကျမည်
    }

    updateHeader();

    setTimeout(() => {
        if(totalSeconds > 0) {
            loadNextQuestion();
        }
    }, 2000);
}

function endGame(message) {
    if(studyTimer) clearInterval(studyTimer);
    
    const container = document.getElementById("quiz-container");
    container.innerHTML = `
        <h3 style="color: #ff9800;">${message}</h3>
        <p style="font-size: 16px;">အမည်: <b style="color: #ffffff;">${playerName}</b></p>
        <p style="font-size: 16px;">စုစုပေါင်း ရမှတ်: <b style="color: #4caf50;">${score} မှတ်</b></p>
        <button class="action-btn" onclick="window.saveScoreToFirebase('${playerName}', ${score})">Cloud သို့ ရမှတ်သိမ်းမည် (Save)</button>
    `;
}
</script>

</body>
</html>
