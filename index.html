<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse Game</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>🧟‍♂️ Zombie Apocalypse</h2>
        <p id="story-text">သင်ဟာ မှောင်မည်းနေတဲ့ အခန်းတစ်ခန်းထဲမှာ ရောက်နေပါတယ်။ အပြင်မှာ ဇာတ်ကောင်တွေရဲ့ အသံတွေ ကြားနေရတယ်။</p>
        
        <div id="button-container">
            <button class="btn" onclick="chooseRoom1()">🚪 အခန်း (၁) ကို စူးစမ်းမည်</button>
            <button class="btn" onclick="chooseBag()">🎒 အိတ်ထဲတွင် ဘာပါလဲ စစ်မည်</button>
            <button class="btn" onclick="chooseRun()">🏃‍♂️ အပြင်သို့ ထွက်ပြေးမည်</button>
        </div>
    </div>

    <script>
        function chooseRoom1() {
            document.getElementById("story-text").innerText = "🚪 သင်ဟာ အခန်းထဲမှာ ဗီရိုတစ်ခုနဲ့ ပြတင်းပေါက်တစ်ခုကို တွေ့လိုက်ရပါတယ်။ ဘာဆက်လုပ်မလဲ?";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="searchWardrobe()">🗄️ ဗီရိုကို ရှာမည်</button>
                <button class="btn" onclick="escapeWindow()">🪟 ပြတင်းပေါက်မှ ထွက်မည်</button>
                <button class="btn" onclick="resetGame()">🔄 အစကနေ ပြန်စမည်</button>
            `;
        }

        function chooseBag() {
            document.getElementById("story-text").innerText = "🎒 သင့်အိတ်ထဲမှာ ရေဘူးတစ်ဘူးနဲ့ ဓားမြှောင်ငယ် တစ်လက် ပါလာပါတယ်။";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="resetGame()">🔄 ပင်မမီနူးသို့ ပြန်ရန်</button>
            `;
        }

        function chooseRun() {
            document.getElementById("story-text").innerText = "🏃‍♂️ သင် အပြင်ကို ထွက်ပြေးဖို့ ကြိုးစားပေမဲ့ ဇာတ်လမ်းက ချက်ချင်းဆိုသလို Zombie တွေနဲ့တိုးပြီး အဆုံးသတ်သွားခဲ့ပါပြီ! (Game Over)";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="resetGame()">🔄 အစကနေ ပြန်စမည်</button>
            `;
        }

        function searchWardrobe() {
            document.getElementById("story-text").innerText = "🎉 ဗီရိုထဲမှာ ကျည်ဆန်အနည်းငယ်နဲ့ သေနတ်တစ်လက်ကို တွေ့ရှိခဲ့ပါတယ်။ သင် အသက်ဆက်ရှင်ဖို့ အခွင့်အရေး ရသွားပါပြီ! (Victory)";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="resetGame()">🔄 ထပ်ဆော့မည်</button>
            `;
        }

        function escapeWindow() {
            document.getElementById("story-text").innerText = "💥 ပြတင်းပေါက်ကနေ ခုန်ချလိုက်တာ ပစ္စည်းထိခိုက်ပြီး ခြေထောက်နာသွားပါတယ်။ ဇာတ်လမ်း ပြီးဆုံးသွားပါပြီ။ (Game Over)";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="resetGame()">🔄 အစကနေ ပြန်စမည်</button>
            `;
        }

        function resetGame() {
            document.getElementById("story-text").innerText = "သင်ဟာ မှောင်မည်းနေတဲ့ အခန်းတစ်ခန်းထဲမှာ ရောက်နေပါတယ်။ အပြင်မှာ ဇာတ်ကောင်တွေရဲ့ အသံတွေ ကြားနေရတယ်။";
            document.getElementById("button-container").innerHTML = `
                <button class="btn" onclick="chooseRoom1()">🚪 အခန်း (၁) ကို စူးစမ်းမည်</button>
                <button class="btn" onclick="chooseBag()">🎒 အိတ်ထဲတွင် ဘာပါလဲ စစ်မည်</button>
                <button class="btn" onclick="chooseRun()">🏃‍♂️ အပြင်သို့ ထွက်ပြေးမည်</button>
            `;
        }
    </script>

</body>
</html>
