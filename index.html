<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deku's Ultra Mastery & Mindset Guide</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #111827;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }
        .header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
        }
        .header h2 { margin: 0; font-size: 16px; color: #fff; }
        .header p { margin: 3px 0 0; font-size: 10px; color: #93c5fd; }

        .card-slider {
            background: #1e293b;
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .card-slider h3 { margin: 0 0 10px 0; font-size: 15px; color: #60a5fa; }
        .card-slider p { margin: 0 0 10px 0; font-size: 12px; color: #94a3b8; line-height: 1.6; }
        
        .action-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #34d399;
            border: 1px dashed #334155;
            margin-top: 10px;
            max-height: 180px;
            overflow-y: auto;
        }
        .action-box strong { color: #facc15; display: block; margin-bottom: 4px; }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            flex: 1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .nav-btn:hover { background: #475569; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .progress-text {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>⚡ Deku's Ultra Growth Guide</h2>
        <p>From Zero to Hero - Physical & Mental Mastery</p>
    </div>

    <div class="progress-text" id="progress-indicator">အဆင့် (၁ / ၄)</div>

    <div class="card-slider" id="card-content">
        <!-- JS CONTENT -->
    </div>

    <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" onclick="changeCard(-1)">⬅️ ရှေ့သို့</button>
        <button class="nav-btn" id="next-btn" onclick="changeCard(1)">နောက်သို့ ➡️</button>
    </div>
</div>

<script>
    const steps = [
        {
            title: "၁။ ကိုယ့်စိတ်ကိုယ် ပြောင်းလဲခြင်းနှင့် သံယောဇဉ်ဖြတ်တောက်ခြင်း",
            desc: "လူတစ်ယောက်ကို ပြောင်းလဲဖို့ အချိန်တွေ မပေးပါနဲ့။ သူ့စိတ်ကို ပြောင်းလို့မရရင် ကိုယ့်စိတ်ကိုပဲ ပြောင်းပစ်လိုက်ပါ။ သူမရှိရင် မဖြစ်ဘူးဆိုတဲ့ အားငယ်စိတ်တွေကို ပြတ်ပြတ်သားသား ဖြတ်တောက်ပြီး ကိုယ့်ပန်းတိုင်ကို အဓိထားပါ။",
            action: "✍️ လက်တွေ့လုပ်ဆောင်ရန်များ:<br>1. သူတပါးထက် ကိုယ့်စိတ်ကို ပိုမိုအာရုံစိုက်ပါ။<br>2. မှီခိုလိုစိတ်နှင့် မျှော်လင့်ချက်များကို ဖယ်ရှားပါ။<br>3. မလိုအပ်ဘဲ အချိန်ပေးစောင့်ဆိုင်းနေခြင်းကို ရပ်တန့်ပါ။"
        },
        {
            title: "၂။ Deku လို စိတ်ဓာတ်နှင့် မာန် တည်ဆောက်ခြင်း",
            desc: "ဘယ်တော့မှ စိတ်ဓာတ်မကျပါနဲ့။ အထင်သေးတဲ့အကြည့်တွေ၊ သနားတဲ့အကြည့်တွေကို နာကျင်စရာအဖြစ် မထားဘဲ အားကျလာရမယ့်အထိ ကြိုးစားမှု မာန်အဖြစ် ပြောင်းလဲလိုက်ပါ။",
            action: "✍️ လက်တွေ့လုပ်ဆောင်ရန်များ:<br>1. အထင်သေးခံရမှုနှင့် နာကျင်ချက်များကို ခွန်အားလုပ်ပါ။<br>2. အနိုင်ကျင့်ခံရတာတွေကို မမေ့ဘဲ ကြိုးစားမှု လောင်စာအဖြစ် ပြောင်းပါ။<br>3. ဘယ်တော့မှ လက်မလျှော့ဘဲ ရှေ့ဆက်ပါ။"
        },
        {
            title: "၃။ Deku's Daily Physical Routine (ကိုယ်လက်လေ့ကျင့်ခန်း)",
            desc: "Deku လို ခန္ဓာကိုယ်ကြံ့ခိုင်ပြီး သန်မာလာစေရန် နေ့စဉ် မနက်နှင့် ညပိုင်းများတွင် ကိုယ်ထည်တည်ဆောက်ရေး လေ့ကျင့်ခန်းများကို ပုံမှန်လုပ်ဆောင်ပါ။",
            action: "✍️ နေ့စဉ် လုပ်ဆောင်ရမည့် စာရင်း:<br>1. မနက်/ည Push-ups (တွန်းထိုးထمرين) စטיםများ ပုံမှန်လုပ်ရန်။<br>2. 10-rep Squats (ထိုင်ထ) များ ဇွဲရှိရှိ လုပ်ရန်။<br>3. Planks (ဗိုက်ကြောအားပြုခြင်း) ၃၅ မှ ၄၀ စက္ကန့်အထိ အချိန်ယူ တည်ဆောက်ရန်။<br>4. အကြောင်းပြချက်မပေးဘဲ တစ်နေ့ ၁ နာရီ လေ့ကျင့်ခန်းလုပ်ရန်။"
        },
        {
            title: "၄။ 63 Days Disappear Challenge (အဆင့်မြှင့်တင်ခြင်း)",
            desc: "ရက် ၆၀ ကျော်အတွင်း ကိုယ့်ကိုယ်ကိုယ် လုံးဝ မသိနိုင်လောက်အောင် ပြောင်းလဲပစ်ဖို့ ဒီစည်းကမ်း ၆ ချက်ကို တင်းတင်းကျပ်ကျပ် လိုက်နာပါရန်။",
            action: "✍️ ရက် ၆၀+ စိန်ခေါ်မှု အချက် ၆ ချက်:<br>1. Social Media ကို တစ်နေ့ ၁၅ မိနစ်ထက် ပိုမသုံးရန်။<br>2. Skill အသစ် တစ်နေ့ အနည်းဆုံး ၁ နာရီ လေ့လာရန်။<br>3. တစ်နေ့ ၁၀ မိနစ် တရားထိုင်ရန်။<br>4. တစ်နေ့ စာအုပ် ၁၀ မျက်နှာ ဖတ်ရန်။<br>5. ည ၁၀ နာရီ အိပ်ရာဝင်ပြီး မနက် ၅ နာရီ အတိအကျ ထရန်။"
        }
    ];

    let currentIndex = 0;

    function renderCard() {
        let item = steps[currentIndex];
        document.getElementById('card-content').innerHTML = `
            <div>
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
                <div class="action-box">
                    <strong>💪 လက်တွေ့လုပ်ဆောင်ရန် အချက်များ:</strong>
                    ${item.action}
                </div>
            </div>
        `;
        document.getElementById('progress-indicator').innerText = `အဆင့် (${currentIndex + 1} / ${steps.length})`;
        
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').disabled = currentIndex === steps.length - 1;
        document.getElementById('next-btn').innerText = currentIndex === steps.length - 1 ? 'ပြီးပါပြီ 🎉' : 'နောက်သို့ ➡️';
    }

    function changeCard(direction) {
        currentIndex += direction;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= steps.length) currentIndex = steps.length - 1;
        renderCard();
    }

    renderCard();
</script>

</body>
</html>
