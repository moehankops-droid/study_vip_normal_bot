<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz App</title>
    <style>
        body {
            font-family: 'Myanmar Standard', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .coin-box {
            background: #fff3cd;
            color: #856404;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 8px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #e2e6ea;
        }
        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #e9ecef;
            display: none;
        }
        .next-btn {
            margin-top: 15px;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: none;
            width: 100%;
        }
        .next-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3 id="question-number">Question 1 / 100</h3>
        <div class="coin-box">🪙 Coins: <span id="coinDisplay">0</span></div>
    </div>

    <div class="question-box" id="questionText">မေးခွန်းကို တင်နေပါသည်...</div>
    
    <div class="options-list" id="optionsContainer">
        <!-- Options တွေဒီမှာပေါ်မယ် -->
    </div>

    <div class="result-box" id="resultDiv"></div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">နောက်တစ်ပုဒ်သို့ (Next) ➡️</button>
</div>

<!-- မေးခွန်း ၁၀၀ ပါဝင်သော Bank ကို တိုက်ရည်ချိတ်ဆက်ရန် သို့မဟုတ် ထည့်ရန် -->
<script src="questions.js"></script>

<script>
    // Coins စနစ် (သီးသန့်ခွဲထုတ်ထားပြီး LocalStorage ဖြင့် အမြဲသိမ်းမည်)
    let userCoins = parseInt(localStorage.getItem('userCoins')) || 0;

    function updateCoinsUI() {
        const coinDisplay = document.getElementById('coinDisplay');
        if (coinDisplay) {
            coinDisplay.innerText = userCoins;
        }
    }

    function addCoins(amount) {
        userCoins += amount;
        localStorage.setItem('userCoins', userCoins);
        updateCoinsUI();
    }

    // App စတင်ချိန် Coins UI ပြရန်
    updateCoinsUI();

    // Quiz Logic
    let currentQuestionIndex = 0;
    let score = 0;

    function loadQuestion(index) {
        if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
            document.getElementById('questionText').innerText = "မေးခွန်းများ ရှာမတွေ့ပါ။ questions.js ဖိုင်ကို စစ်ဆေးပါ။";
            return;
        }

        const q = questionsBank[index];
        document.getElementById('question-number').innerText = `Question ${index + 1} / ${questionsBank.length}`;
        document.getElementById('questionText').innerText = q.question;
        
        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';
        
        document.getElementById('resultDiv').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';

        q.options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => selectAnswer(option, q.answer, q.explanation);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedOption, correctAnswer, explanation) {
        const resultDiv = document.getElementById('resultDiv');
        const nextBtn = document.getElementById('nextBtn');
        const options = document.querySelectorAll('.option-btn');

        // ခလုတ်အားလုံးကို ပိတ်မည် (ထပ်မနှိပ်နိုင်အောင်)
        options.forEach(btn => btn.disabled = true);

        if (selectedOption === correctAnswer) {
            resultDiv.innerHTML = `<span style="color: green; font-weight: bold;">✅ မှန်ကန်ပါသည်။</span><br><br><b>ရှင်းပြချက်:</b> ${explanation}`;
            addCoins(10); // ဖြေမှန်လျှင် 🪙 ၁၀ coins ရမည်
            score++;
        } else {
            resultDiv.innerHTML = `<span style="color: red; font-weight: bold;">❌ မှားယွင်းပါသည်။</span> (အမှန်မှာ: <b>${correctAnswer}</b> ဖြစ်ပါသည်)<br><br><b>ရှင်းပြချက်:</b> ${explanation}`;
        }

        resultDiv.style.display = 'block';
        nextBtn.style.display = 'block'; // ရှင်းပြချက်ဖတ်ပြီးမှ Next နှိပ်ရန် ပေါ်လာမည် (Timer လုံးဝမပါပါ)
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsBank.length) {
            loadQuestion(currentQuestionIndex);
        } else {
            document.querySelector('.container').innerHTML = `
                <h2 style="text-align: center;">🎉 Quiz ပြီးဆုံးပါပြီ!</h2>
                <p style="text-align: center; font-size: 18px;">ရမှတ်: <b>${score} / ${questionsBank.length}</b></p>
                <p style="text-align: center; font-size: 18px;">စုဆောင်းရရှိသော Coins: <b>🪙 ${userCoins}</b></p>
                <button class="next-btn" style="display: block; background: #28a745;" onclick="location.reload()">အစမှ ပြန်စမည်</button>
            `;
        }
    }

    // စတင် Run မည်
    window.onload = () => {
        loadQuestion(currentQuestionIndex);
    };
</script>

</body>
</html>
