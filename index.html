<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz - Challenge & Leaderboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid #333;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            font-weight: bold; 
            font-size: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }
        .streak { color: #ff9800; }
        .score { color: #4caf50; }
        .study-timer { 
            background: #2a2a2a; 
            color: #00e676; 
            font-weight: bold; 
            font-size: 15px; 
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        
        h2 { color: #ffffff; margin-top: 0; font-size: 22px; }
        
        .start-btn, .action-btn { 
            background: #4caf50; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        .start-btn:hover, .action-btn:hover { background: #43a047; }

        .question-box { 
            font-size: 18px; 
            margin: 15px 0 20px 0; 
            font-weight: bold; 
            color: #ffffff; 
            text-align: left; 
            line-height: 1.5;
        }
        
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 15px; 
        }
        
        .options button { 
            background: #2a2a2a; 
            color: #e0e0e0; 
            border: 1px solid #444; 
            border-radius: 12px; 
            width: 100%; 
            text-align: left; 
            padding: 14px 16px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease;
        }
        .options button:hover { 
            background: #333333; 
            border-color: #4caf50; 
            color: #ffffff; 
        }

        .explanation { 
            margin-top: 15px; 
            padding: 12px; 
            background: #1b2e1b; 
            border: 1px solid #2e7d32; 
            text-align: left; 
            font-size: 13px; 
            color: #a5d6a7; 
            display: none; 
            border-radius: 10px; 
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .leaderboard-list {
            text-align: left;
            background: #252525;
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #333;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .leaderboard-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="streak">🔥 Streak: <span id="streak-count">0</span></span>
        <span class="score">⭐ Score: <span id="score-count">0</span></span>
    </div>
    <h2>English Grammar Quiz</h2>
    <div id="quiz-container">
        <p style="color: #aaa; font-size: 15px;">မိနစ် ၂၀ စာကျက်ချိန်အတွင်း သူငယ်ချင်းများနှင့် အမှတ်ပြိုင်ဆိုင်မည့် စနစ်။</p>
        <button class="start-btn" onclick="startQuiz()">စတင်မည် (Challenge)</button>
        
        <div id="leaderboard-section" class="leaderboard-list" style="margin-top: 20px;">
            <strong style="color: #ff9800; font-size: 14px;">🏆 ထိပ်ဆုံး ရမှတ်များ (Leaderboard)</strong>
            <div id="high-scores" style="margin-top: 8px;">
                <p style="color: #777; font-size: 13px; text-align: center;">မှတ်တမ်း မရှိသေးပါ။</p>
            </div>
        </div>
    </div>
</div>

<script src="questions.js"></script>

<script>
let score = 0;
let streak = 0;
let currentQuiz = null;
let studyTimer = null;
let totalSeconds = 20 * 60;

window.onload = function() {
    displayLeaderboard();
};

function startQuiz() {
    score = 0;
    streak = 0;
    totalSeconds = 20 * 60;
    updateHeader();
    startStudySessionTimer();
    loadNextQuestion();
}

function updateHeader() {
    document.getElementById("score-count").innerText = score;
    document.getElementById("streak-count").innerText = streak;
}

function startStudySessionTimer() {
    if(studyTimer) clearInterval(studyTimer);

    studyTimer = setInterval(() => {
        totalSeconds--;
        let mins = Math.floor(totalSeconds / 60);
        let secs = totalSeconds % 60;
        
        let timerDisplay = document.getElementById("session-timer");
        if(timerDisplay) {
            timerDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        if (totalSeconds <= 0) {
            clearInterval(studyTimer);
            endGame("အချိန်ပြည့်သွားပါပြီ!");
        }
    }, 1000);
}

function loadNextQuestion() {
    if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
        document.getElementById("quiz-container").innerHTML = "<p style='color:#f44336; font-weight:bold;'>မေးခွန်းများ ရှာမတွေ့ပါ။</p>";
        return;
    }

    let mins = Math.floor(totalSeconds / 60);
    let secs = totalSeconds % 60;
    let timeFormatted = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * questionsBank.length);
    currentQuiz = questionsBank[randomIndex];

    let optionsHTML = "";
    currentQuiz.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${currentQuiz.answer.replace(/'/g, "\\'")}', '${currentQuiz.explanation.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="study-timer">
            <span>⏳ ကျန်ရှိချိန်:</span>
            <span id="session-timer" style="font-family: monospace; font-size: 16px;">${timeFormatted}</span>
        </div>
        <div class="question-box">${currentQuiz.question}</div>
        <div class="options">${optionsHTML}</div>
        <div id="explanation-box" class="explanation"></div>
    `;
}

function checkAnswer(button, selected, correct, explanation) {
    const buttons = document.querySelectorAll('.options button');
    buttons.forEach(btn => btn.disabled = true);

    const expBox = document.getElementById("explanation-box");
    expBox.style.display = "block";
    expBox.innerHTML = `<strong>ရှင်းလင်းချက်:</strong> ${explanation}`;

    if (selected.trim() === correct.trim()) {
        button.style.background = "#1b2e1b";
        button.style.color = "#a5d6a7";
        button.style.borderColor = "#4caf50";
        
        expBox.style.background = "#1b2e1b";
        expBox.style.color = "#a5d6a7";
        expBox.style.borderColor = "#4caf50";
        
        score += 10;
        streak += 1;
    } else {
        button.style.background = "#3c1f1f";
        button.style.color = "#ef9a9a";
        button.style.borderColor = "#f44336";
        
        expBox.style.background = "#3c1f1f";
        expBox.style.color = "#ef9a9a";
        expBox.style.borderColor = "#f44336";
        
        streak = 0;
    }

    updateHeader();

    setTimeout(() => {
        if(totalSeconds > 0) {
            loadNextQuestion();
        }
    }, 2000);
}

function endGame(message) {
    if(studyTimer) clearInterval(studyTimer);
    
    const container = document.getElementById("quiz-container");
    container.innerHTML = `
        <h3 style="color: #ff9800;">${message}</h3>
        <p style="font-size: 16px;">သင်ရရှိသော ရမှတ်: <b style="color: #4caf50;">${score} မှတ်</b></p>
        <p style="font-size: 14px; color: #aaa;">Leaderboard တွင် မှတ်တမ်းတင်ရန် သင့်နာမည်ကို ထည့်ပါ:</p>
        <input type="text" id="player-name" placeholder="သင့်နာမည် (Name) ထည့်ရန်..." maxlength="15">
        <button class="action-btn" onclick="saveScore()">ရမှတ်သိမ်းမည်</button>
    `;
}

function saveScore() {
    const nameInput = document.getElementById("player-name").value.trim();
    if(!nameInput) {
        alert("ကျေးဇူးပြု၍ နာမည်ထည့်ပါ။");
        return;
    }

    let highScores = JSON.parse(localStorage.getItem("quizHighScores")) || [];
    highScores.push({ name: nameInput, score: score });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 5); // ထိပ်ဆုံး ၅ ယောက်ပဲ သိမ်းမည်

    localStorage.setItem("quizHighScores", JSON.stringify(highScores));
    location.reload();
}

function displayLeaderboard() {
    let highScores = JSON.parse(localStorage.getItem("quizHighScores")) || [];
    const lbContainer = document.getElementById("high-scores");
    
    if(highScores.length === 0) return;

    let html = "";
    highScores.forEach((item, index) => {
        html += `
            <div class="leaderboard-item">
                <span>#${index + 1} ${item.name}</span>
                <span style="color: #4caf50; font-weight: bold;">${item.score} မှတ်</span>
            </div>
        `;
    });
    lbContainer.innerHTML = html;
}
</script>

</body>
</html>
