<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Quiz - Global Leaderboard</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid #333;
        }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            background: #252525;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .nav-tab {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-tab.active {
            background: #4caf50;
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            font-weight: bold; 
            font-size: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }
        .streak { color: #ff9800; }
        .score { color: #4caf50; }
        .study-timer { 
            background: #2a2a2a; 
            color: #00e676; 
            font-weight: bold; 
            font-size: 15px; 
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        
        h2 { color: #ffffff; margin-top: 0; font-size: 20px; }
        
        .start-btn, .action-btn, .finish-btn, .edit-btn { 
            background: #4caf50; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        .start-btn:hover, .action-btn:hover { background: #43a047; }
        .finish-btn { background: #ff5252; margin-top: 10px; }
        .finish-btn:hover { background: #e53935; }
        .edit-btn { background: #ff9800; font-size: 14px; padding: 8px; margin-top: 5px; }
        .edit-btn:hover { background: #f57c00; }

        .question-box { 
            font-size: 17px; 
            margin: 15px 0 20px 0; 
            font-weight: bold; 
            color: #ffffff; 
            text-align: left; 
            line-height: 1.5;
        }
        
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 15px; 
        }
        
        .options button { 
            background: #2a2a2a; 
            color: #e0e0e0; 
            border: 1px solid #444; 
            border-radius: 12px; 
            width: 100%; 
            text-align: left; 
            padding: 14px 16px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease;
        }
        .options button:hover { 
            background: #333333; 
            border-color: #4caf50; 
            color: #ffffff; 
        }

        .explanation { 
            margin-top: 15px; 
            padding: 12px; 
            background: #1b2e1b; 
            border: 1px solid #2e7d32; 
            text-align: left; 
            font-size: 13px; 
            color: #a5d6a7; 
            display: none; 
            border-radius: 10px; 
            line-height: 1.4;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .leaderboard-list {
            text-align: left;
            background: #252525;
            padding: 12px 15px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #333;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .leaderboard-item:last-child { border-bottom: none; }

        .weekly-banner {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255,152,0,0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tab Navigation Bar -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('home-tab')">🏠 ပင်မ</button>
        <button class="nav-tab" onclick="switchTab('quiz-tab')">📝 Quiz</button>
        <button class="nav-tab" onclick="switchTab('leaderboard-tab')">🏆 Leaderboard</button>
    </div>

    <!-- Home Tab -->
    <div id="home-tab" class="tab-content active">
        <h2>English Grammar Quiz</h2>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">မိနစ် ၂၀ စာကျက်ချိန် • Streak များလေ မှတ်ပိုရလေ</p>
        
        <div id="user-setup-box">
            <div style="text-align: left; margin-bottom: 5px; font-size: 13px; color: #ff9800;">သင့်နာမည် (Username) ထည့်ပါ:</div>
            <input type="text" id="username-input" placeholder="ဥပမာ - Moe Han" maxlength="15">
            <button class="start-btn" onclick="saveInitialUsername()">နာမည်သိမ်းမည်</button>
        </div>
    </div>

    <!-- Quiz Tab -->
    <div id="quiz-tab" class="tab-content">
        <div class="header">
            <span class="streak">🔥 Streak: <span id="streak-count">0</span></span>
            <span class="score">⭐ Score: <span id="score-count">0</span></span>
        </div>
        <div id="quiz-container">
            <p style="color: #aaa; font-size: 14px; margin: 30px 0;">ပထမဆုံး 'ပင်မ' Tab မှတဆင့် Username ထည့်ပြီးမှ Quiz စတင်နိုင်ပါသည်။</p>
            <button class="start-btn" onclick="startQuiz()">Quiz စတင်မည် (Start)</button>
        </div>
    </div>

    <!-- Leaderboard Tab -->
    <div id="leaderboard-tab" class="tab-content">
        <div id="weekly-winner-container"></div>
        
        <div class="leaderboard-list">
            <strong style="color: #ff9800; font-size: 14px;">🏆 ကမ္ဘာ့ထိပ်ဆုံး ရမှတ်များ (Leaderboard)</strong>
            <div id="high-scores" style="margin-top: 8px;">
                <p style="color: #777; font-size: 13px; text-align: center;">ဒေတာများ ရယူနေပါသည်...</p>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClv4XqqbYFcRowwpV8StLFWwbjaOx-5gQ",
    authDomain: "study-bot-61a39.firebaseapp.com",
    databaseURL: "https://study-bot-61a39-default-rtdb.firebaseio.com",
    projectId: "study-bot-61a39",
    storageBucket: "study-bot-61a39.firebasestorage.app",
    messagingSenderId: "637683324139",
    appId: "1:637683324139:web:db8c8af2ebeaa555f69aae"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.saveScoreToFirebase = function(name, finalScore) {
      const cleanName = name.replace(/[.#$\/\[\]]/g, "_").trim();
      const userScoreRef = ref(db, 'scores/' + cleanName);

      get(userScoreRef).then((snapshot) => {
          let existingScore = 0;
          if (snapshot.exists()) {
              existingScore = snapshot.val().score || 0;
          }

          if (finalScore >= existingScore) {
              set(userScoreRef, {
                  name: name,
                  score: finalScore,
                  timestamp: Date.now()
              }).then(() => {
                  alert(`🎉 ဂုဏ်ယူပါတယ်! သင်၏ အမှတ် (${finalScore} မှတ်) ကို Leaderboard သို့ သိမ်းဆည်းပြီးပါပြီ။`);
                  switchTab('leaderboard-tab');
              }).catch((error) => {
                  alert("❌ သိမ်းဆည်းရာတွင် အမှားအယွင်းရှိပါသည်: " + error.message);
              });
          } else {
              alert(`ℹ️ သင်၏ ယခင်အမှတ်အမြင့်ဆုံး (${existingScore} မှတ်) ကသာ ပိုများနေပါသသည်။`);
              switchTab('leaderboard-tab');
          }
      });
  };

  window.loadLeaderboardFromFirebase = function() {
      const scoresRef = ref(db, 'scores');
      const topScoresQuery = query(scoresRef, orderByChild('score'), limitToLast(10));
      
      onValue(topScoresQuery, (snapshot) => {
          const lbContainer = document.getElementById("high-scores");
          const winnerContainer = document.getElementById("weekly-winner-container");

          if (!snapshot.exists()) {
              lbContainer.innerHTML = `<p style="color: #777; font-size: 13px; text-align: center;">မှတ်တမ်း မရှိသေးပါ။</p>`;
              winnerContainer.innerHTML = '';
              return;
          }

          let scoresList = [];
          snapshot.forEach((childSnapshot) => {
              scoresList.push(childSnapshot.val());
          });

          scoresList.sort((a, b) => b.score - a.score);

          const topWinner = scoresList[0];
          winnerContainer.innerHTML = `
              <div class="weekly-banner">
                  <div style="font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">🌟 Weekly Champion 🌟</div>
                  <div style="font-size: 18px; font-weight: bold; margin: 5px 0;">👑 ${topWinner.name}</div>
                  <div style="font-size: 14px; opacity: 0.9;">ရမှတ်: ${topWinner.score} မှတ်</div>
              </div>
          `;

          let html = "";
          scoresList.forEach((item, index) => {
              let isMe = (item.name === localStorage.getItem("quizUsername"));
              let itemStyle = isMe ? "background: #2e4a2e; border: 1px solid #4caf50; border-radius: 8px; padding: 6px 10px; margin-bottom: 5px;" : "padding: 6px 10px; border-bottom: 1px solid #333;";
              let rankIcon = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;

              html += `
                  <div class="leaderboard-item" style="${itemStyle} display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
                      <span><b>${rankIcon} ${item.name}</b> ${isMe ? ' (ကိုယ့်အမှတ်)' : ''}</span>
                      <span style="color: #4caf50; font-weight: bold;">${item.score} မှတ်</span>
                  </div>
              `;
          });
          lbContainer.innerHTML = html;
      });
  };

  window.loadLeaderboardFromFirebase();
</script>

<script src="questions.js"></script>

<script>
let playerName = "";
let score = 0;
let streak = 0;
let currentQuiz = null;
let studyTimer = null;
let totalSeconds = 20 * 60;

window.onload = function() {
    checkSavedUser();
};

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    
    if(tabId === 'home-tab') document.querySelectorAll('.nav-tab')[0].classList.add('active');
    if(tabId === 'quiz-tab') document.querySelectorAll('.nav-tab')[1].classList.add('active');
    if(tabId === 'leaderboard-tab') document.querySelectorAll('.nav-tab')[2].classList.add('active');
}

function checkSavedUser() {
    const savedUser = localStorage.getItem("quizUsername");
    const lastChangeTime = localStorage.getItem("quizNameChangeTime");
    const now = Date.now();
    const oneWeek = 7 * 24 * 60 * 60 * 1000;

    const setupBox = document.getElementById("user-setup-box");

    if (savedUser) {
        playerName = savedUser;
        let timeLeftText = "";
        let canChange = true;

        if (lastChangeTime) {
            let elapsed = now - parseInt(lastChangeTime);
            if (elapsed < oneWeek) {
                let daysLeft = Math.ceil((oneWeek - elapsed) / (1000 * 60 * 60 * 24));
                timeLeftText = ` (နာမည်ပြောင်းရန် ${daysLeft} ရက် စောင့်ရန်လို)`;
                canChange = false;
            }
        }

        setupBox.innerHTML = `
            <div style="background: #2a2a2a; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #444;">
                <p style="margin: 0; font-size: 13px; color: #aaa;">အသုံးပြုနေသော နာမည်:</p>
                <b style="font-size: 18px; color: #4caf50;">${playerName}</b>
            </div>
            <button class="start-btn" onclick="switchTab('quiz-tab'); startQuiz();">Quiz စတင်ဆော့မည်</button>
            <button class="edit-btn" onclick="requestNameChange(${canChange})">နာမည်ပြောင်းရန်${timeLeftText}</button>
        `;
    }
}

function requestNameChange(canChange) {
    if (!canChange) {
        alert("⏳ နာမည်ပြောင်းရန်အတွက် ၁ ပတ် (7 Days) ပြည့်ရန် လိုအပ်ပါသေးသည်။");
        return;
    }

    const setupBox = document.getElementById("user-setup-box");
    setupBox.innerHTML = `
        <div style="text-align: left; margin-bottom: 5px; font-size: 13px; color: #ff9800;">နာမည်အသစ် ထည့်ပါ (၁ ပတ်မှ ၁ ကြိမ်သာ ပြောင်းနိုင်သည်):</div>
        <input type="text" id="username-input" placeholder="နာမည်အသစ်..." maxlength="15" value="${playerName}">
        <button class="start-btn" onclick="saveInitialUsername()">နာမည်သိမ်းမည်</button>
    `;
}

function saveInitialUsername() {
    const nameInput = document.getElementById("username-input").value.trim();
    if (!nameInput) {
        alert("ကျေးဇူးပြု၍ သင့်နာမည် (Username) ကို အရင်ထည့်ပါ။");
        return;
    }
    playerName = nameInput;
    localStorage.setItem("quizUsername", playerName);
    localStorage.setItem("quizNameChangeTime", Date.now().toString());
    
    alert("✅ နာမည်ကို အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!");
    checkSavedUser();
    switchTab('quiz-tab');
    startQuiz();
}

function startQuiz() {
    if(!playerName) {
        alert("ကျေးဇူးပြု၍ ပထမဆုံး 'ပင်မ' Tab တွင် နာမည်အရင်ထည့်ပါ။");
        switchTab('home-tab');
        return;
    }
    score = 0;
    streak = 0;
    totalSeconds = 20 * 60;
    updateHeader();
    startStudySessionTimer();
    loadNextQuestion();
}

function updateHeader() {
    document.getElementById("score-count").innerText = score;
    document.getElementById("streak-count").innerText = streak;
}

function startStudySessionTimer() {
    if(studyTimer) clearInterval(studyTimer);

    studyTimer = setInterval(() => {
        totalSeconds--;
        let mins = Math.floor(totalSeconds / 60);
        let secs = totalSeconds % 60;
        
        let timerDisplay = document.getElementById("session-timer");
        if(timerDisplay) {
            timerDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        if (totalSeconds <= 0) {
            clearInterval(studyTimer);
            endGame("⏳ မိနစ် ၂၀ ပြည့်သွားပါပြီ!");
        }
    }, 1000);
}

function loadNextQuestion() {
    if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
        document.getElementById("quiz-container").innerHTML = "<p style='color:#f44336; font-weight:bold;'>မေးခွန်းများ ရှာမတွေ့ပါ။</p>";
        return;
    }

    let mins = Math.floor(totalSeconds / 60);
    let secs = totalSeconds % 60;
    let timeFormatted = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * questionsBank.length);
    currentQuiz = questionsBank[randomIndex];

    let optionsHTML = "";
    currentQuiz.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${currentQuiz.answer.replace(/'/g, "\\'")}', '${currentQuiz.explanation.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="study-timer">
            <span>⏳ ကျန်ရှိချိန်:</span>
            <span id="session-timer" style="font-family: monospace; font-size: 16px;">${timeFormatted}</span>
        </div>
        <div class="question-box">${currentQuiz.question}</div>
        <div class="options">${optionsHTML}</div>
        <div id="explanation-box" class="explanation"></div>
        <button class="finish-btn" onclick="endGame('🛑 လေ့ကျင့်ခန်းကို ပြီးဆုံးခဲ့ပါပြီ!')">လေ့ကျင့်ခန်း ပြီးဆုံးမည် (Finish)</button>
    `;
}

function checkAnswer(button, selected, correct, explanation) {
    const buttons = document.querySelectorAll('.options button');
    buttons.forEach(btn => btn.disabled = true);

    const expBox = document.getElementById("explanation-box");
    expBox.style.display = "block";
    expBox.innerHTML = `<strong>ရှင်းလင်းချက်:</strong> ${explanation}`;

    if (selected.trim() === correct.trim()) {
        button.style.background = "#1b2e1b";
        button.style.color = "#a5d6a7";
        button.style.borderColor = "#4caf50";
        
        expBox.style.background = "#1b2e1b";
        expBox.style.color = "#a5d6a7";
        expBox.style.borderColor = "#4caf50";
        
        streak += 1;
        score += streak; 
    } else {
        button.style.background = "#3c1f1f";
        button.style.color = "#ef9a9a";
        button.style.borderColor = "#f44336";
        
        expBox.style.background = "#3c1f1f";
        expBox.style.color = "#ef9a9a";
        expBox.style.borderColor = "#f44336";
        
        streak = 0;
    }

    updateHeader();

    setTimeout(() => {
        if(totalSeconds > 0) {
            loadNextQuestion();
        }
    }, 2000);
}

function endGame(message) {
    if(studyTimer) clearInterval(studyTimer);
    
    const container = document.getElementById("quiz-container");
    container.innerHTML = `
        <h3 style="color: #ff9800;">${message}</h3>
        <p style="font-size: 16px;">အမည်: <b style="color: #ffffff;">${playerName}</b></p>
        <p style="font-size: 16px;">စုစုပေါင်း ရမှတ်: <b style="color: #4caf50;">${score} မှတ်</b></p>
        <button class="action-btn" id="save-btn">Cloud သို့ ရမှတ်သိမ်းမည် (Save)</button>
        <button class="start-btn" onclick="startQuiz()" style="margin-top: 10px; background: #2196f3;">🔄 ထပ်မံဖြေဆိုရန် (Play Again)</button>
    `;

    document.getElementById("save-btn").addEventListener("click", function() {
        if (typeof window.saveScoreToFirebase === "function") {
            window.saveScoreToFirebase(playerName, score);
        } else {
            alert("❌ Firebase ချိတ်ဆက်မှု အဆင်မပြေပါ။ ခဏစောင့်ပြီး ထပ်ကြိုးစားပါ။");
        }
    });
}
</script>

</body>
</html>
