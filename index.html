<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Apocalypse: Choices & Consequences</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;

            padding: 20px;
        }
        .game-container {
            max-width: 600px;

            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            border: 1px solid #333;
        }
        h2 {
            color: #ff4757;
            margin-bottom: 20px;
        }
        #story-text {
            font-size: 17px;

            text-align: left;

            padding: 15px;

        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;

</head>
<body>

    <div class="game-container">

        </div>
    </div>

            document.getElementById("button-container").innerHTML = `

                <button class="btn" onclick="choice3D()">🚗 ရပ်ထားတဲ့ ကားကို စက်နှိုးပြီး မြို့ပြင်ထွက်မည်</button>

                <button class="btn" onclick="choice3F()">🎒 လိုအပ်တဲ့ ပစ္စည်းတွေ ထပ်သိမ်းပြီး နေထိုင်ရာပြောင်းမည်</button>
            `;

        function choice2E() {
            document.getElementById("story-text").innerHTML = "<b>အကျိုးဆက်:</b> ဒုတိယထပ်ကနေ အسرအမြန် ခုန်ချလိုက်တာကြောင့် ခြေထောက် အပြင်းအထန် ထိခိုက်နာကျင်သွားပြီး လမ်းပေါ်မှာ မလှုပ်နိုင်တော့ပါဘူး။<br><br><b>(Game Over: ခြေထောက်ကျိုးသွားပြီး Zombie တွေရဲ့ ဝိုင်းဝဲခြင်းကို ခံလိုက်ရပါပြီ)</b>";

            document.getElementById("story-text").innerHTML = "<b>အကျိုးဆက်:</b> ရေချိုးခန်းထဲမှာ ပုန်းနေပေမဲ့ အပြင်ဘက်က တိုက်ခန်းပါ ထွက်ပေါက်မရှိတော့လို့ ပိတ်မိနေဆဲပါပဲ။ နောက်ဆုံးမှာ အစားအသောက်ပြတ်ပြီး အညတရ အဆုံးသတ်သွားခဲ့ရပါတယ်။<br><br><b>(Game Over: ရေချိုးခန်းထဲမှာ ပိတ်မိပြီး ဆုံးပါးသွားပါပြီ)</b>";
