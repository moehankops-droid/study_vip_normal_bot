<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Tenses Quiz - Duolingo Style</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #58cc02; }
        button { background: #58cc02; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #46a302; }
        .question-box { font-size: 18px; margin: 20px 0; font-weight: bold; color: #333; }
        .options button { background: #fff; color: #4b4b4b; border: 2px solid #e5e5e5; margin: 8px 0; }
        .options button:hover { background: #f7f7f7; border-color: #58cc02; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏳ English Tenses Quiz</h2>
    <div id="quiz-container">
        <p>Tenses လေ့ကျင့်ခန်းများ ဖြေဆိုရန် ခလုတ်ကို နှိပ်ပါ</p>
        <button onclick="loadAIQuestion()">မေးခွန်းအသစ် တောင်းမည်</button>
    </div>
</div>

<script>
// English Tenses သီးသန့် မေးခွန်းများ စုစည်းမှု
const tensesQuestions = [
    { question: "She _____ to school every day.", options: ["go", "goes", "going", "gone"], answer: "goes" },
    { question: "They _____ football in the playground now.", options: ["play", "plays", "are playing", "played"], answer: "are playing" },
    { question: "He has _____ his homework already.", options: ["finish", "finishes", "finished", "finishing"], answer: "finished" },
    { question: "My mother _____ cooking when I arrived home.", options: ["is", "was", "were", "are"], answer: "was" },
    { question: "She _____ her grandmother next week.", options: ["visit", "visited", "will visit", "visiting"], answer: "will visit" },
    { question: "Look! The birds _____ in the sky.", options: ["fly", "flies", "are flying", "flew"], answer: "are flying" },
    { question: "Water _____ at 100 degrees Celsius.", options: ["boil", "boils", "boiled", "boiling"], answer: "boils" },
    { question: "I _____ English for three years.", options: ["learn", "learned", "have learned", "learning"], answer: "have learned" },
    { question: "They _____ a new car last month.", options: ["buy", "buys", "bought", "buying"], answer: "bought" },
    { question: "While I was reading, he _____ television.", options: ["watch", "watched", "was watching", "is watching"], answer: "was watching" }
];

function loadAIQuestion() {
    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * tensesQuestions.length);
    const quizData = tensesQuestions[randomIndex];

    let optionsHTML = "";
    quizData.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer('${opt}', '${quizData.answer}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="question-box">${quizData.question}</div>
        <div class="options">${optionsHTML}</div>
    `;
}

function checkAnswer(selected, correct) {
    if (selected.trim() === correct.trim()) {
        alert("🎉 မှန်ကန်ပါတယ် သူငယ်ချင်းရေ!");
    } else {
        alert(`❌ မှားပါတယ်။ အဖြေမှန်ကတော့: ${correct} ပါ။`);
    }
    loadAIQuestion();
}
</script>

</body>
</html>
