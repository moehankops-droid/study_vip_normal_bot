<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Open World RPG</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #334155;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover { background: #2563eb; }
        .hidden { display: none; }
        .question-box {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🗺️ English Open World RPG</h2>
    
    <!-- Player Stats -->
    <div class="stats">
        <div>⭐ Level: <span id="lvl">1</span></div>
        <div>⚡ XP: <span id="xp">0</span></div>
        <div>❤️ HP: <span id="hp">100</span></div>
    </div>

    <!-- Map Screen -->
    <div id="map-screen">
        <p>သင်သည် အင်္ဂလိပ်စာ တောအုပ်ထဲသို့ ရောက်ရှိနေပါသည်။ ရှေ့ဆက်ရန် လမ်းကြောင်းကို ရွေးပါ။</p>
        <button class="btn" onclick="startQuest('grammar')">🌲 Grammar တောအုပ်သို့ ဝင်မည်</button>
        <button class="btn" onclick="startQuest('vocab')">⚔️ Vocabulary နဂါးနှင့် တိုက်မည်</button>
    </div>

    <!-- Quest / Battle Screen -->
    <div id="quest-screen" class="hidden">
        <div class="question-box">
            <p id="q-text">Question goes here</p>
            <div id="options"></div>
        </div>
        <button class="btn" style="background: #ef4444;" onclick="returnToMap()">🔙 ထွက်မည်</button>
    </div>
</div>

<script>
    let player = { level: 1, xp: 0, hp: 100 };

    const questions = {
        grammar: {
            q: "What is the past tense of 'go'?",
            options: ["Goed", "Gone", "Went", "Going"],
            answer: 2
        },
        vocab: {
            q: "What does 'Courage' mean?",
            options: ["ကြောက်ရွံ့ခြင်း", "သတ္တိရှိခြင်း", "ပျင်းရိခြင်း", "ဝမ်းနည်းခြင်း"],
            answer: 1
        }
    };

    let currentQuestType = '';

    function updateStats() {
        document.getElementById('lvl').innerText = player.level;
        document.getElementById('xp').innerText = player.xp;
        document.getElementById('hp').innerText = player.hp;
    }

    function startQuest(type) {
        currentQuestType = type;
        document.getElementById('map-screen').classList.add('hidden');
        document.getElementById('quest-screen').classList.remove('hidden');

        let qData = questions[type];
        document.getElementById('q-text').innerText = qData.q;
        
        let optHtml = '';
        qData.options.forEach((opt, index) => {
            optHtml += `<button class="btn" onclick="checkAnswer(${index})">${opt}</button>`;
        });
        document.getElementById('options').innerHTML = optHtml;
    }

    function checkAnswer(selected) {
        let qData = questions[currentQuestType];
        if (selected === qData.answer) {
            alert("🎉 အဖြေမှန်ပါတယ်! XP +20 ရရှိသည်။");
            player.xp += 20;
            if (player.xp >= 50) {
                player.level++;
                player.xp = 0;
                alert("🌟 Level တက်သွားပါပြီ!");
            }
        } else {
            alert("❌ အဖြေမှားပါတယ်။ HP -20 လျော့သွားသည်။");
            player.hp -= 20;
            if (player.hp <= 0) {
                alert("💀 Game Over! သင့်အသက်ကုန်သွားပါပြီ။");
                player.hp = 100;
                player.xp = 0;
            }
        }
        updateStats();
        returnToMap();
    }

    function returnToMap() {
        document.getElementById('quest-screen').classList.add('hidden');
        document.getElementById('map-screen').classList.remove('hidden');
    }

    updateStats();
</script>

</body>
</html>
