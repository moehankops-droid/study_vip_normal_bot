<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Tenses & Grammar Quiz</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #58cc02; }
        button { background: #58cc02; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #46a302; }
        .question-box { font-size: 18px; margin: 20px 0; font-weight: bold; color: #333; }
        .options button { background: #fff; color: #4b4b4b; border: 2px solid #e5e5e5; margin: 8px 0; width: 100%; }
        .options button:hover { background: #f7f7f7; border-color: #58cc02; }
    </style>
</head>
<body>

<div class="card">
    <h2>⏳ English Tenses Quiz</h2>
    <div id="quiz-container">
        <p>မေးခွန်းများ စတင်ဖြေဆိုရန် အောက်ပါခလုတ်ကို နှိပ်ပါ</p>
        <button onclick="loadNextQuestion()">စတင်မည်</button>
    </div>
</div>

<!-- သီးသန့်ခွဲထားသော မေးခွန်းဖိုင်ကို ချိတ်ဆက်ခြင်း -->
<script src="questions.js"></script>

<script>
function loadNextQuestion() {
    // questions.js ထဲက questionsBank ကို ယူသုံးမည်
    if (typeof questionsBank === 'undefined' || questionsBank.length === 0) {
        document.getElementById("quiz-container").innerHTML = "<p style='color:red;'>မေးခွန်းများ ရှာမတွေ့ပါ သို့မဟုတ် questions.js ဖိုင် မမှန်ပါ။</p>";
        return;
    }

    const container = document.getElementById("quiz-container");
    const randomIndex = Math.floor(Math.random() * questionsBank.length);
    const quizData = questionsBank[randomIndex];

    let optionsHTML = "";
    quizData.options.forEach(opt => {
        optionsHTML += `<button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${quizData.answer.replace(/'/g, "\\'")}')">${opt}</button>`;
    });

    container.innerHTML = `
        <div class="question-box">${quizData.question}</div>
        <div class="options">${optionsHTML}</div>
    `;
}

function checkAnswer(button, selected, correct) {
    const buttons = document.querySelectorAll('.options button');
    buttons.forEach(btn => btn.disabled = true);

    if (selected.trim() === correct.trim()) {
        button.style.background = "#58cc02";
        button.style.color = "white";
        setTimeout(() => {
            alert("🎉 မှန်ကန်ပါတယ် သူငယ်ချင်းရေ!");
            loadNextQuestion();
        }, 300);
    } else {
        button.style.background = "#ff4b4b";
        button.style.color = "white";
        setTimeout(() => {
            alert(`❌ မှားပါတယ်။ အဖြေမှန်ကတော့: ${correct} ပါ။`);
            loadNextQuestion();
        }, 300);
    }
}
</script>

</body>
</html>
